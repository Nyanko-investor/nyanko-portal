    <script>
        // お天気ウィジェットの取得ロジック
        async function fetchWeather() {
            try {
                // 気象庁とOpen-Meteoのデータを取得
                const [jmaRes, meteoRes] = await Promise.all([
                    fetch("https://www.jma.go.jp/bosai/forecast/data/forecast/140000.json"),
                    fetch("https://api.open-meteo.com/v1/forecast?latitude=35.45&longitude=139.65&current=relative_humidity_2m&timezone=Asia%2FTokyo")
                ]);
                
                const jmaData = await jmaRes.json();
                const meteoData = await meteoRes.json();
                
                const humidity = meteoData.current.relative_humidity_2m;
                
                // 天気テキストの整形
                let rawWeather = jmaData[0].timeSeries[0].areas[0].weathers[0].replace(/　/g, " ");
                let words = rawWeather.split(" ");
                let main = words[0];
                if (main.includes("晴")) main = "晴れ";
                else if (main.includes("雨")) main = "雨";
                else if (main.includes("雪")) main = "雪";
                else if (main.includes("くもり") || main.includes("曇")) main = "くもり";
                
                let sub = "";
                for (let i = 1; i < words.length; i++) {
                    if (words[i].includes("晴") && main !== "晴れ") sub = "晴れ";
                    else if (words[i].includes("雨") && main !== "雨") sub = "雨";
                    else if (words[i].includes("雪") && main !== "雪") sub = "雪";
                    else if ((words[i].includes("くもり") || words[i].includes("曇")) && main !== "くもり") sub = "くもり";
                }
                let weatherShort = sub ? `${main}一時${sub}` : main;

                // お天気アイコンの自動判定
                let icon = "☁️";
                if (main === "晴れ") icon = "☀️";
                else if (main === "雨") icon = "☔️";
                else if (main === "雪") icon = "⛄️";
                
                // 降水確率
                let pop = jmaData[0].timeSeries[1].areas[0].pops[0] || "0";
                
                // 気温の振り分け（昼間の更新バグ対策済）
                let temps = jmaData[0].timeSeries[2].areas[0].temps;
                let minTemp = "--", maxTemp = "--";
                if (temps && temps.length >= 2) {
                    let t1 = parseInt(temps[0]);
                    let t2 = parseInt(temps[1]);
                    minTemp = Math.min(t1, t2).toString();
                    maxTemp = Math.max(t1, t2).toString();
                } else if (temps && temps.length === 1) {
                    maxTemp = temps[0];
                }
                
                // 傘と服のアドバイス
                let maxT = parseInt(maxTemp) || 20;
                let popInt = parseInt(pop);
                let umbrella = popInt >= 50 ? "かならず持参" : popInt >= 30 ? "おりたたみ推奨" : "今日は不要";
                let clothes = maxT >= 25 ? "はんそで" : maxT >= 20 ? "ながそで" : maxT >= 15 ? "上着" : "コート";

                // HTMLに流し込む
                const widget = document.getElementById("weather-widget");
                widget.innerHTML = `
                    <div class="weather-main"><span class="icon">${icon}</span>【横浜】${weatherShort}</div>
                    <div style="font-size: 1.05rem; margin-bottom: 8px;">
                        気温: <b>${maxTemp}℃</b> / <b>${minTemp}℃</b> (湿${humidity}%) | 降水: <b>${pop}%</b>
                    </div>
                    <div class="weather-sub">🌂 傘: ${umbrella} ｜ 👕 服: ${clothes}</div>
                `;
            } catch (error) {
                console.error("天気取得エラー", error);
                document.getElementById("weather-widget").innerHTML = "天気データの取得に失敗しました😿";
            }
        }

        // ページ読み込み時に実行する処理まとめ
        document.addEventListener('DOMContentLoaded', () => {
            // お天気の取得を開始！
            fetchWeather();
        });
