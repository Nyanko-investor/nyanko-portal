<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="3600">
    <title>Nyanko Portal Kindle</title>
    <style>
        body {
            background-color: #ffffff;
            color: #000000;
            font-family: sans-serif;
            text-align: center;
            margin: 0;
            padding: 10px;
        }
        /* ヘッダー（日付と更新時間） */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-bottom: 3px solid #000;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        /* 文字数が増えたので少しだけサイズを調整 */
        .date {
            font-size: 2.2rem;
            font-weight: bold;
        }
        .time {
            font-size: 1.5rem;
            font-weight: bold;
            white-space: nowrap; /* 更新時間が改行されるのを防ぐ */
        }
        /* メインの天気（5rem → 4rem に少し縮小） */
        .weather {
            font-size: 4rem;
            font-weight: bold;
            margin: 20px 0;
            line-height: 1.2;
        }
        .temp {
            font-size: 4rem;
            font-weight: bold;
            margin-bottom: 30px;
        }
        /* アドバイスのボックス */
        .advice-box {
            border: 5px solid #000;
            border-radius: 15px;
            padding: 20px;
            margin: 10px 20px;
            text-align: left;
            font-weight: bold;
        }
        .advice-item {
            font-size: 2.5rem;
            margin: 15px 0;
            display: flex;
            align-items: center;
        }
        /* 文字アイコンの部分（[傘] [服装]） */
        .text-icon {
            font-size: 2rem;
            margin-right: 15px;
            min-width: 80px;
            text-align: center;
            font-weight: normal;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="date" id="dateText">----年(令和-年) -月-日(-)</div>
        <div class="time" id="updateTime">--:-- 更新</div>
    </div>

    <div class="weather" id="weatherText">読込中...</div>
    <div class="temp">
        <span id="minTemp">--</span>℃ / <span id="maxTemp">--</span>℃
    </div>

    <div class="advice-box">
        <div class="advice-item">
            <span class="text-icon">[傘]</span>
            <span id="umbrellaText">確認中...</span>
        </div>
        <div class="advice-item">
            <span class="text-icon">[服装]</span>
            <span id="clothesText">確認中...</span>
        </div>
    </div>

    <script>
        const url = "https://www.jma.go.jp/bosai/forecast/data/forecast/140000.json";

        async function fetchWeather() {
            try {
                const response = await fetch(url);
                const data = await response.json();

                // 1. 日付（西暦・和暦・曜日）と更新時間のセット
                const now = new Date();
                
                const year = now.getFullYear();
                const reiwa = year - 2018; // 令和の計算
                const days = ['日', '月', '火', '水', '木', '金', '土'];
                const dayStr = days[now.getDay()];
                
                document.getElementById('dateText').innerText = `${year}年(令和${reiwa}年) ${now.getMonth() + 1}月${now.getDate()}日(${dayStr})`;
                
                const h = String(now.getHours()).padStart(2, '0');
                const m = String(now.getMinutes()).padStart(2, '0');
                document.getElementById('updateTime').innerText = `${h}:${m} 更新`;

                // 2. 天気テキストの取得と小学校漢字への調整
                let rawWeather = data[0].timeSeries[0].areas[0].weathers[0];
                let cleanWeather = rawWeather.replace(/　/g, ' ')
                                             .replace(/曇り/g, 'くもり');
                document.getElementById('weatherText').innerText = cleanWeather;

                // 3. 傘のアドバイス
                if (cleanWeather.includes('雨') || cleanWeather.includes('雪')) {
                    document.getElementById('umbrellaText').innerText = "忘れないで持っていこう！";
                } else {
                    document.getElementById('umbrellaText').innerText = "今日は持たなくていいよ！";
                }

                // 4. 気温の取得と服装アドバイス
                const temps = data[0].timeSeries[2].areas[0].temps;
                let maxT = 20; 
                
                if(temps.length >= 2) {
                    const t1 = parseInt(temps[0]);
                    const t2 = parseInt(temps[1]);
                    document.getElementById('minTemp').innerText = Math.min(t1, t2);
                    maxT = Math.max(t1, t2);
                    document.getElementById('maxTemp').innerText = maxT;
                }

                let clothesMsg = "";
                if (maxT >= 25) {
                    clothesMsg = "半そでがいいね！";
                } else if (maxT >= 20) {
                    clothesMsg = "長そでのシャツがピッタリ！";
                } else if (maxT >= 15) {
                    clothesMsg = "上着を持っていこう！";
                } else if (maxT >= 10) {
                    clothesMsg = "セーターかコートを着てね！";
                } else {
                    clothesMsg = "ダウンや手ぶくろで暖かく！";
                }
                document.getElementById('clothesText').innerText = clothesMsg;

            } catch (error) {
                document.getElementById('weatherText').innerText = "エラーが起きたよ";
            }
        }

        fetchWeather();
    </script>
</body>
</html>
