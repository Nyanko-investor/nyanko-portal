<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="3600">
    <title>Nyanko Portal Kindle</title>
    <style>
        body {
            background-color: #ffffff;
            color: #000000;
            font-family: sans-serif;
            text-align: center;
            margin: 0;
            padding: 0; 
        }

        /* --- ヘッダー部分のレイアウト（今のまま維持） --- */
        .header-container {
            margin-top: 30px; 
            padding: 0 10px;
        }
        
        .header {
            display: flex;
            flex-direction: column;
            align-items: center; 
            border-bottom: 3px solid #000;
            padding-bottom: 10px;
            margin-bottom: 30px; 
        }

        .date {
            font-size: 2.2rem;
            font-weight: bold;
            margin-bottom: 20px; 
        }
        
        .time {
            font-size: 1.5rem;
            font-weight: bold;
            white-space: nowrap;
        }

        /* --- メインコンテンツ（今のまま維持） --- */
        .main-content {
            padding: 0 10px;
        }
        
        .weather {
            font-size: 4rem;
            font-weight: bold;
            margin: 20px 0;
            line-height: 1.2;
        }
        
        .temp {
            font-size: 4rem;
            font-weight: bold;
            margin-bottom: 30px;
        }

        /* --- アドバイスボックス（イマイチの解消） --- */
        .advice-box {
            border: 5px solid #000;
            border-radius: 15px;
            padding: 20px;
            margin: 10px 20px;
            text-align: left;
            font-weight: bold;
        }
        
        .advice-item {
            font-size: 2.5rem; 
            margin: 15px 0;
            display: flex; 
            align-items: center; /* 縦方向は中央揃え */
            /* 全体を少し中央寄りに */
            padding: 0 10px; 
        }
        
        .text-icon {
            /* フォントサイズをメッセージと同じに */
            font-size: 2.5rem; 
            /* アイコンとメッセージの間の空白（今のまま維持） */
            margin-right: 15px; 
            /* 【修正】min-widthを撤廃。幅を固定しない */
            min-width: 0; 
            width: auto; 
            text-align: center;
            font-weight: normal; 
        }

        /* 【追加】メッセージ部分（はみ出し防止と改行） */
        #umbrellaText, #clothesText {
            word-break: break-all; /* 文字がはみ出すのを防ぐ */
            flex: 1; /* 残りの幅をすべて使い、改行を許可する */
        }
    </style>
</head>
<body>

    <div class="header-container">
        <div class="header">
            <div class="date" id="dateText">----年(令和-年) -月-日(-)</div>
            <div class="time" id="updateTime">--:-- 更新</div>
        </div>
    </div>

    <div class="main-content">
        <div class="weather" id="weatherText">読込中...</div>
        <div class="temp">
            <span id="minTemp">--</span>℃ / <span id="maxTemp">--</span>℃
        </div>

        <div class="advice-box">
            <div class="advice-item">
                <span class="text-icon">[傘]</span>
                <span id="umbrellaText">確認中...</span>
            </div>
            <div class="advice-item">
                <span class="text-icon">[服装]</span>
                <span id="clothesText">確認中...</span>
            </div>
        </div>
    </div>

    <script>
        // 日本時間（Asia/Tokyo）に固定するためのDateTimeFormatのオプション
        const options = { timeZone: 'Asia/Tokyo', hour12: false, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' };
        const formatter = new Intl.DateTimeFormat('ja-JP', options);

        const url = "https://www.jma.go.jp/bosai/forecast/data/forecast/140000.json";

        async function fetchWeather() {
            try {
                const response = await fetch(url);
                const data = await response.json();

                // 【修正】KindleのUTC問題を回避し、日本時間を強制取得
                const parts = formatter.formatToParts(new Date());

                const year = parseInt(parts.find(p => p.type === 'year').value);
                const month = parseInt(parts.find(p => p.type === 'month').value);
                const day = parseInt(parts.find(p => p.type === 'day').value);
                const h = parts.find(p => p.type === 'hour').value;
                const m = parts.find(p => p.type === 'minute').value;

                // 日付（和暦と曜日）の計算
                const dateObj = new Date(year, month - 1, day);
                const reiwa = year - 2018; 
                const days = ['日', '月', '火', '水', '木', '金', '土'];
                const dayStr = days[dateObj.getDay()];
                
                document.getElementById('dateText').innerText = `${year}年(令和${reiwa}年) ${month}月${day}日(${dayStr})`;
                document.getElementById('updateTime').innerText = `${h}:${m} 更新`;

                // 天気テキストの取得と小学校漢字への調整
                let rawWeather = data[0].timeSeries[0].areas[0].weathers[0];
                let cleanWeather = rawWeather.replace(/　/g, ' ')
                                             .replace(/曇り/g, 'くもり');
                document.getElementById('weatherText').innerText = cleanWeather;

                // 傘のアドバイス
                if (cleanWeather.includes('雨') || cleanWeather.includes('雪')) {
                    document.getElementById('umbrellaText').innerText = "忘れないで持っていこう！";
                } else {
                    document.getElementById('umbrellaText').innerText = "今日は持たなくていいよ！";
                }

                // 気温の取得と服装アドバイス
                const temps = data[0].timeSeries[2].areas[0].temps;
                let maxT = 20; 
                
                if(temps.length >= 2) {
                    const t1 = parseInt(temps[0]);
                    const t2 = parseInt(temps[1]);
                    document.getElementById('minTemp').innerText = Math.min(t1, t2);
                    maxT = Math.max(t1, t2);
                    document.getElementById('maxTemp').innerText = maxT;
                }

                let clothesMsg = "";
                if (maxT >= 25) {
                    clothesMsg = "半そでがいいね！";
                } else if (maxT >= 20) {
                    clothesMsg = "長そでのシャツがピッタリ！";
                } else if (maxT >= 15) {
                    clothesMsg = "上着を持っていこう！";
                } else if (maxT >= 10) {
                    clothesMsg = "セーターかコートを着てね！";
                } else {
                    clothesMsg = "ダウンや手ぶくろで暖かく！";
                }
                document.getElementById('clothesText').innerText = clothesMsg;

            } catch (error) {
                document.getElementById('weatherText').innerText = "エラーが起きたよ";
            }
        }

        fetchWeather();
    </script>
</body>
</html>
