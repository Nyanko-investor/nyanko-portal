<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="21600">
    <title>Kindle News</title>

    <!--
        Kindle用ニュース画面 サンプルコード

        このファイルは、CSSとJavaScriptをHTML内にまとめた構成です。
        別途 style.css や script.js を用意する必要はありません。

        index.html と同じフォルダに置いて使ってください。
        index.html 側の「今日のニュースを読む」リンクから、この news.html に移動します。
    -->

    <style>
        body {
            background-color: #ffffff;
            color: #000000;
            font-family: sans-serif;
            margin: 0;
            padding: 10px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #000;
            padding-bottom: 6px;
            margin-bottom: 10px;
        }

        .back-link {
            display: inline-block;
            font-size: 1.4rem;
            font-weight: bold;
            text-decoration: none;
            color: #000000;
            border: 2px solid #000;
            padding: 4px 10px;
            border-radius: 6px;
        }

        .page-title {
            font-size: 1.8rem;
            font-weight: bold;
        }

        .news-list {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        .news-item {
            font-size: 1.5rem;
            line-height: 1.25;
            margin-bottom: 10px;
            border-bottom: 1px dashed #ccc;
            padding-bottom: 8px;
            font-weight: bold;
        }

        .news-date {
            font-size: 1.1rem;
            color: #555;
            margin-top: 3px;
            font-weight: normal;
        }

        .error {
            font-size: 1.5rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">
        <a href="kindle_tenki.html" class="back-link">← 天気に戻る</a>
        <div class="page-title">今日のニュース</div>
    </div>

    <ul class="news-list" id="generalContainer">
        <li class="news-item">ニュースを取得中...</li>
    </ul>

    <script>
        // ============================================================
        // ▼▼▼ ここを書き換えると、自分用にカスタマイズできます ▼▼▼
        // ============================================================

        // 【取得するニュースRSS】
        // 初期設定では Googleニュースの国内トップニュースを取得します。
        // 必要に応じて、別のRSS URLに変更してください。
        const NEWS_RSS_URL = "https://news.google.com/rss?hl=ja&gl=JP&ceid=JP:ja";

        // 【表示するニュース件数】
        // Kindleの画面ではスクロールがもっさりするため、5〜7件程度がおすすめです。
        const NEWS_LIMIT = 7;

        // ============================================================
        // ▲▲▲ 基本的には、ここより下はそのままでOKです ▲▲▲
        // ============================================================

        async function fetchNewsData(rssUrl, containerId) {
            try {
                const uniqueTime = new Date().getTime();
                const apiUrl =
                    `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}&_=${uniqueTime}`;

                const response = await fetch(apiUrl);
                const data = await response.json();

                const container = document.getElementById(containerId);
                container.innerHTML = "";

                if (data.items && data.items.length > 0) {
                    const limit = Math.min(data.items.length, NEWS_LIMIT);

                    for (let i = 0; i < limit; i++) {
                        const item = data.items[i];

                        // Googleニュースのタイトルは「記事タイトル - 配信元」の形になりやすいため、
                        // 最後の " - " で分割して、記事タイトルと配信元を分けます。
                        const splitIndex = item.title.lastIndexOf(" - ");
                        let cleanTitle = item.title;
                        let sourceName = "";

                        if (splitIndex !== -1) {
                            cleanTitle = item.title.substring(0, splitIndex);
                            sourceName = item.title.substring(splitIndex + 3);
                        }

                        let timeText = "--:--";

                        if (item.pubDate) {
                            const pubDate = new Date(item.pubDate.replace(/-/g, '/'));
                            const h = pubDate.getHours().toString().padStart(2, '0');
                            const m = pubDate.getMinutes().toString().padStart(2, '0');
                            timeText = `${h}:${m}`;
                        }

                        const li = document.createElement('li');
                        li.className = 'news-item';

                        li.innerHTML = `
                            <div>・${cleanTitle}</div>
                            <div class="news-date">(${sourceName} ${timeText} 配信)</div>
                        `;

                        container.appendChild(li);
                    }
                } else {
                    container.innerHTML =
                        "<li class='news-item error'>ニュースが見つかりませんでした</li>";
                }
            } catch (error) {
                document.getElementById(containerId).innerHTML =
                    "<li class='news-item error'>取得エラーが発生しました</li>";
            }
        }

        fetchNewsData(NEWS_RSS_URL, "generalContainer");
    </script>
</body>
</html>
