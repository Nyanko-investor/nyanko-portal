<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="21600">
    <title>Nyanko News Kindle</title>
    <style>
        body {
            background-color: #ffffff;
            color: #000000;
            font-family: sans-serif;
            margin: 0;
            padding: 10px;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #000;
            padding-bottom: 6px;
            margin-bottom: 10px;
        }
        .back-link {
            display: inline-block;
            font-size: 1.4rem;
            font-weight: bold;
            text-decoration: none;
            color: #000000;
            border: 2px solid #000;
            padding: 4px 10px;
            border-radius: 6px;
        }
        .page-title {
            font-size: 1.8rem;
            font-weight: bold;
        }

        .news-list {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }
        .news-item {
            font-size: 1.5rem; 
            line-height: 1.25;
            margin-bottom: 10px;
            border-bottom: 1px dashed #ccc;
            padding-bottom: 8px;
            font-weight: bold;
        }
        .news-date {
            font-size: 1.1rem;
            color: #555;
            margin-top: 3px;
            font-weight: normal;
        }
        .error {
            font-size: 1.5rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">
        <a href="kindle_tenki.html" class="back-link">← 天気に戻る</a>
        <div class="page-title">今日のニュース</div>
    </div>

    <ul class="news-list" id="generalContainer">
        <li class="news-item">ニュースを取得中...</li>
    </ul>

    <script>
        async function fetchNewsData(rssUrl, containerId) {
            try {
                const uniqueTime = new Date().getTime();
                const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}&_=${uniqueTime}`;

                const response = await fetch(apiUrl);
                const data = await response.json();

                const container = document.getElementById(containerId);
                container.innerHTML = ""; 

                if (data.items && data.items.length > 0) {
                    const limit = Math.min(data.items.length, 7);
                    for (let i = 0; i < limit; i++) {
                        const item = data.items[i];
                        
                        // タイトルと配信元（- 〇〇新聞など）を綺麗に分割
                        const splitIndex = item.title.lastIndexOf(" - ");
                        let cleanTitle = item.title;
                        let sourceName = "";
                        
                        if (splitIndex !== -1) {
                            cleanTitle = item.title.substring(0, splitIndex);
                            sourceName = item.title.substring(splitIndex + 3);
                        }
                        
                        const pubDate = new Date(item.pubDate.replace(/-/g, '/'));
                        const h = pubDate.getHours().toString().padStart(2, '0');
                        const m = pubDate.getMinutes().toString().padStart(2, '0');

                        const li = document.createElement('li');
                        li.className = 'news-item';
                        li.innerHTML = `
                            <div>・${cleanTitle}</div>
                            <div class="news-date">(${sourceName} ${h}:${m} 配信)</div>
                        `;
                        container.appendChild(li);
                    }
                } else {
                    container.innerHTML = "<li class='news-item error'>ニュースが見つかりませんでした</li>";
                }
            } catch (error) {
                document.getElementById(containerId).innerHTML = "<li class='news-item error'>取得エラーが発生しました</li>";
            }
        }

        // Googleニュース（国内トップ）を取得
        fetchNewsData("https://news.google.com/rss?hl=ja&gl=JP&ceid=JP:ja", "generalContainer");

    </script>
</body>
</html>
