<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="21600">
    <title>Nyanko Portal Kindle</title>
    <style>
        body {
            background-color: #ffffff;
            color: #000000;
            font-family: sans-serif;
            text-align: center;
            margin: 0;
            padding: 0; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header-container { margin-top: 10px; padding: 0 10px; }
        .header { display: flex; flex-direction: column; align-items: center; border-bottom: 2px solid #000; padding-bottom: 15px; margin-bottom: 15px; }
        .date { font-size: 2.5rem; font-weight: bold; margin-bottom: 2px; } 
        .time { font-size: 1.4rem; font-weight: bold; white-space: nowrap; margin-top: 8px; margin-bottom: 10px;}
        .header-countdown { font-size: 2.0rem; font-weight: bold; margin-top: 2px; }
        
        .main-content { padding: 0 10px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        
        /* 天気テキストのベースを小さくし、天気ワードだけ大きくする */
        .weather { font-size: 1.8rem; font-weight: normal; margin: 5px 0; line-height: 1.4; } 
        .weather-word { font-size: 3.5rem; font-weight: bold; margin: 0 4px; vertical-align: middle; }
        
        .temp-container { margin-bottom: 10px; display: flex; flex-direction: column; align-items: center; line-height: 1.2; }
        .temp { font-size: 3.0rem; font-weight: bold; }
        .humidity { font-size: 2.0rem; font-weight: normal; margin-top: 5px; }
        
        .advice-box { border: 3px solid #000; border-radius: 10px; padding: 6px; margin: 0 15px; text-align: left; font-weight: bold; }
        .advice-item {
            font-size: 1.9rem; 
            margin: 6px 0; 
            display: flex;
            align-items: center;
            padding: 0 5px;
            white-space: nowrap; 
            overflow: hidden; 
        }
        .text-icon { font-size: 1.9rem; margin-right: 8px; text-align: center; font-weight: normal; white-space: nowrap; }
        #umbrellaText, #clothesText { 
            flex: 1; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
        }

        /* 明日の天気用のデザイン */
        .tomorrow-box {
            border: 2px dashed #000; 
            border-radius: 8px; 
            padding: 8px; 
            margin: 10px 15px 0 15px; 
            text-align: center; 
        }
        .tomorrow-title { font-size: 1.6rem; font-weight: bold; margin-bottom: 5px; }
        .tomorrow-weather { font-size: 1.4rem; font-weight: normal; margin-bottom: 5px; line-height: 1.4; }
        .tomorrow-box .weather-word { font-size: 2.2rem; font-weight: bold; margin: 0 2px; vertical-align: middle; }
        .tomorrow-temp { font-size: 1.9rem; font-weight: bold; }

        .extra-info-box {
            margin: 15px 15px 25px 15px; 
            text-align: left;
            font-weight: bold;
            font-size: 1.7rem; 
            display: flex;
            flex-direction: column;
        }
        .extra-info-box div {
            margin-bottom: 12px; 
        }
        .extra-info-box div:last-child {
            margin-bottom: 0;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <div class="header">
            <div class="date" id="dateText">----年(令和-年) -月-日(-)</div>
            <div class="time" id="updateTime">--:-- 更新</div>
            <div class="header-countdown" id="countdownText">目標日まで計算中...</div>
        </div>
    </div>

    <div class="main-content">
        <div>
            <div class="weather" id="weatherText"></div>
            
            <div class="temp-container">
                <div class="temp">
                    <span id="minTemp">--</span>℃ / <span id="maxTemp">--</span>℃
                </div>
                <div class="humidity" id="humidityText">
                    (湿度 --% / 風速 --m/s)
                </div>
            </div>
        </div>

        <div class="advice-box">
            <div class="advice-item">
                <span class="text-icon">[雨傘]</span>
                <span id="umbrellaText">確認中...</span>
            </div>
            <div class="advice-item">
                <span class="text-icon">[服装]</span>
                <span id="clothesText">確認中...</span>
            </div>
        </div>

        <div class="tomorrow-box">
            <div class="tomorrow-title">明日 (<span id="tomorrowDate">--/--</span>) の天気</div>
            <div class="tomorrow-weather" id="tomorrowWeatherText">--</div>
            <div class="tomorrow-temp"><span id="tomorrowMinTemp">--</span>℃ / <span id="tomorrowMaxTemp">--</span>℃</div>
        </div>

        <div class="extra-info-box">
            <div id="trainText">・運行情報確認中...</div>
            <div><a href="news.html" style="color: #000; text-decoration: none; border-bottom: 1px solid #000;">・今日のニュースを読む</a></div>
        </div>
    </div>

    <script>
        // カバーを開けた瞬間に更新させるためのイベントリスナー（物理ハック用）
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                fetchWeather();
            }
        });

        async function fetchWeather() {
            try {
                const updateTimeEl = document.getElementById('updateTime');
                updateTimeEl.innerText = "更新中...";

                const uniqueTime = new Date().getTime();
                
                // 【★カスタマイズ箇所①：地域設定】デフォルトは東京です。
                const jmaUrl = "https://www.jma.go.jp/bosai/forecast/data/forecast/130000.json?_=" + uniqueTime;
                const meteoUrl = "https://api.open-meteo.com/v1/forecast?latitude=35.6895&longitude=139.6917&current=relative_humidity_2m,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min&timezone=Asia%2FTokyo&_=" + uniqueTime;

                const response = await fetch(jmaUrl);
                const data = await response.json();

                // ▼ Kindleのタイムゾーン無視！絶対日本時間(JST)計算システム ▼
                const now = new Date();
                const jstNow = new Date(now.getTime() + 32400000); 
                
                const year = jstNow.getUTCFullYear();
                const month = jstNow.getUTCMonth() + 1;
                const day = jstNow.getUTCDate();
                const h = jstNow.getUTCHours().toString().padStart(2, '0');
                const m = jstNow.getUTCMinutes().toString().padStart(2, '0');
                const dayStr = ['日', '月', '火', '水', '木', '金', '土'][jstNow.getUTCDay()];
                const reiwa = year - 2018; 
                
                document.getElementById('dateText').innerText = `${year}年(令和${reiwa}年) ${month}月${day}日(${dayStr})`;

                // ▼ 明日の日付計算 ▼
                const tomorrow = new Date(jstNow.getTime() + 86400000); // 24時間足す
                const tMonth = tomorrow.getUTCMonth() + 1;
                const tDay = tomorrow.getUTCDate();
                const tDayStr = ['日', '月', '火', '水', '木', '金', '土'][tomorrow.getUTCDay()];
                document.getElementById('tomorrowDate').innerText = `${tMonth}月${tDay}日(${tDayStr})`;

                // ▼ 天気ワードを抽出して大きくする正規表現 ▼
                const weatherWordRegex = /(晴れ|晴|くもり|雨|雪|雷|みぞれ)/g;

                // ▼ スマート改行ロジック用の正規表現（ここがポイント！） ▼
                // 時間帯キーワード
                const timeKeywords = /(明け方|朝|昼前|昼過ぎ|夕方|夜のはじめ頃|夜遅く|夜)/g;
                // 地名（画像にある具体的な例）
                const locationKeywords = /(多摩西部)/g;


                // 今日の天気
                let rawWeather = data[0].timeSeries[0].areas[0].weathers[0];
                let cleanWeather = rawWeather.replace(/　/g, ' ').replace(/曇り/g, 'くもり').replace(/後/g, 'のち');
                
                // スマート改行：時間帯や地名の前で改行
                let htmlWeather = cleanWeather.replace(timeKeywords, '<br>$1');
                htmlWeather = htmlWeather.replace(locationKeywords, '<br>$1');
                // 既存の改行（のち、時々）
                htmlWeather = htmlWeather.replace(/(のち|時々|ときどき|一時)/g, '<br>$1');
                
                // 天気ワードだけを抽出して大きくする
                htmlWeather = htmlWeather.replace(weatherWordRegex, '<span class="weather-word">$1</span>');
                document.getElementById('weatherText').innerHTML = htmlWeather;


                // 明日の天気（今日と同じロジックを適用）
                try {
                    let rawTomorrow = data[0].timeSeries[0].areas[0].weathers[1];
                    if (rawTomorrow) {
                        let cleanTomorrow = rawTomorrow.replace(/　/g, ' ').replace(/曇り/g, 'くもり').replace(/後/g, 'のち');
                        
                        let htmlTomorrow = cleanTomorrow.replace(timeKeywords, '<br>$1');
                        htmlTomorrow = htmlTomorrow.replace(locationKeywords, '<br>$1');
                        htmlTomorrow = htmlTomorrow.replace(/(のち|時々|ときどき|一時)/g, '<br>$1');
                        htmlTomorrow = htmlTomorrow.replace(weatherWordRegex, '<span class="weather-word">$1</span>');
                        document.getElementById('tomorrowWeatherText').innerHTML = htmlTomorrow;
                    }
                } catch(e) {
                    document.getElementById('tomorrowWeatherText').innerText = "取得不可";
                }

                // 傘・服装アドバイス
                if (cleanWeather.startsWith('雨') || cleanWeather.startsWith('雪')) {
                    document.getElementById('umbrellaText').innerText = "傘を忘れないで持っていこう！";
                } 
                else if (cleanWeather.includes('雨') || cleanWeather.includes('雪')) {
                    document.getElementById('umbrellaText').innerText = "折りたたみ傘があると安心！";
                } 
                else {
                    document.getElementById('umbrellaText').innerText = "今日は持たなくていいよ！";
                }

                // 気温と湿度（今日と明日）
                try {
                    const meteoRes = await fetch(meteoUrl);
                    const meteoData = await meteoRes.json();
                    
                    const humidity = meteoData.current.relative_humidity_2m;
                    const wind = meteoData.current.wind_speed_10m; 
                    document.getElementById('humidityText').innerText = `(湿度 ${humidity}% / 風速 ${wind}m/s)`;

                    // 今日の気温
                    const minT = Math.round(meteoData.daily.temperature_2m_min[0]);
                    const maxT = Math.round(meteoData.daily.temperature_2m_max[0]);
                    document.getElementById('minTemp').innerText = minT;
                    document.getElementById('maxTemp').innerText = maxT;

                    // 明日の気温
                    const minT_tmrw = Math.round(meteoData.daily.temperature_2m_min[1]);
                    const maxT_tmrw = Math.round(meteoData.daily.temperature_2m_max[1]);
                    document.getElementById('tomorrowMinTemp').innerText = minT_tmrw;
                    document.getElementById('tomorrowMaxTemp').innerText = maxT_tmrw;

                    // 服装判定
                    let clothesMsg = "";
                    if (maxT >= 25) { clothesMsg = "半そでがいいね！"; } 
                    else if (maxT >= 20) { clothesMsg = "長そでのシャツがピッタリ！"; } 
                    else if (maxT >= 15) { clothesMsg = "上着を持っていこう！"; } 
                    else if (maxT >= 10) { clothesMsg = "セーターかコートを着てね！"; } 
                    else { clothesMsg = "ダウンや手ぶくろで暖かく！"; }
                    document.getElementById('clothesText').innerText = clothesMsg;

                } catch (e) {
                    document.getElementById('humidityText').innerText = "(湿度 --% / 風速 --m/s)";
                    document.getElementById('minTemp').innerText = "--";
                    document.getElementById('maxTemp').innerText = "--";
                    document.getElementById('tomorrowMinTemp').innerText = "--";
                    document.getElementById('tomorrowMaxTemp').innerText = "--";
                }

                // 運行情報
                try {
                    const trainUrl = "https://api.rss2json.com/v1/api.json?rss_url=https://transit.yahoo.co.jp/diainfo/rss/1/0&_=" + uniqueTime;
                    const trainRes = await fetch(trainUrl);
                    const trainData = await trainRes.json();
                    
                    let isDelayed = false;
                    if (trainData.items) {
                        for (let item of trainData.items) {
                            // 【★カスタマイズ箇所②：路線名】
                            if (item.title.includes("山手線")) {
                                isDelayed = true;
                                break;
                            }
                        }
                    }
                    
                    const trainEl = document.getElementById('trainText');
                    if (isDelayed) {
                        trainEl.innerText = "・登録路線に遅れが出ています";
                    } else {
                        trainEl.innerText = "・登録路線は平常運転です";
                    }
                } catch (e) {
                    document.getElementById('trainText').innerText = "・運行情報が取得できません";
                }

                // カウントダウン
                try {
                    // 【★カスタマイズ箇所③：目標日】
                    const targetDate = new Date('2025-12-31T00:00:00+09:00');
                    const todayForCount = new Date();
                    
                    const diffTime = targetDate - todayForCount;
                    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                    
                    const countdownEl = document.getElementById('countdownText');
                    if (diffDays > 0) {
                        countdownEl.innerText = `目標日まで あと${diffDays}日！`;
                    } else if (diffDays === 0) {
                        countdownEl.innerText = `いよいよ当日！全力を出し切れ！`;
                    } else {
                        countdownEl.innerText = `目標日を達成しました！`;
                    }
                } catch (e) {
                    document.getElementById('countdownText').innerText = "";
                }

                updateTimeEl.innerText = `${h}:${m} 更新`;

            } catch (error) {
                document.getElementById('weatherText').innerText = "エラーが起きました";
                document.getElementById('updateTime').innerText = "更新失敗";
            }
        }

        // 初回読み込み時の実行
        fetchWeather();

        // 6時間ごとにページ全体をリロードしてメモリをクリア（古いブラウザのフリーズ対策）
        setTimeout(() => {
            window.location.reload();
        }, 21600000); 

    </script>
</body>
</html>
